name: "Check that my NPM packages are available on npmjs.com"
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

jobs:
  check_availability:
    name: "Fetch packages"
    runs-on: ubuntu-latest
    steps:
      - name: "Fetch packages"
        run: node check-package-availability.ts
